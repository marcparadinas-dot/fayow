name: iOS Deploy to App Store

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'

      - name: Install dependencies
        run: flutter pub get

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Install certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.DISTRIBUTION_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          echo -n "$CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          security create-keychain -p "" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "" $KEYCHAIN_PATH
          security import $CERTIFICATE_PATH -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

      - name: Install Ad Hoc provisioning profile
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_ADHOC_BASE64 }}
        run: |
          PP_PATH=$RUNNER_TEMP/profile.mobileprovision
          echo -n "$PROVISIONING_PROFILE_BASE64" | base64 --decode -o $PP_PATH
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Generate Flutter build files
        run: |
          flutter build ios --release --no-codesign --config-only
          rm -f ios/Podfile.lock
          cd ios
          pod install
          cd ..
          PODS_PBXPROJ="ios/Pods/Pods.xcodeproj/project.pbxproj"
          if [ -f "$PODS_PBXPROJ" ]; then
            sed -i '' 's/-GCC_WARN_INHIBIT_ALL_WARNINGS //g' "$PODS_PBXPROJ"
            sed -i '' 's/ -GCC_WARN_INHIBIT_ALL_WARNINGS//g' "$PODS_PBXPROJ"
            echo "Patched project.pbxproj"
            grep "GCC_WARN_INHIBIT" "$PODS_PBXPROJ" | head -3 || echo "Flag supprimé avec succès"
          fi

      - name: Debug BoringSSL config
        run: |
          echo "=== GCC_WARN dans pbxproj ==="
          grep -n "GCC_WARN_INHIBIT" ios/Pods/Pods.xcodeproj/project.pbxproj | head -20
          echo "=== OTHER_CFLAGS BoringSSL ==="
          grep -n -A2 -B2 "GCC_WARN_INHIBIT" ios/Pods/Pods.xcodeproj/project.pbxproj | grep -A5 -B5 "BoringSSL" | head -30

      - name: Build and sign IPA
        run: |
          BORING_DIR="ios/Pods/Target Support Files/BoringSSL-GRPC"
          if [ -d "$BORING_DIR" ]; then
            for f in "$BORING_DIR"/*.xcconfig; do
              sed -i '' 's/-GCC_WARN_INHIBIT_ALL_WARNINGS//g' "$f"
            done
          fi
          PODS_PBXPROJ="ios/Pods/Pods.xcodeproj/project.pbxproj"
          if [ -f "$PODS_PBXPROJ" ]; then
            sed -i '' 's/GCC_WARN_INHIBIT_ALL_WARNINGS = YES;//g' "$PODS_PBXPROJ"
          fi
          xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath $RUNNER_TEMP/Runner.xcarchive \
            archive \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=U8M5VHA6GM \
            PROVISIONING_PROFILE_SPECIFIER="FaYoW AdHoc Test" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            -allowProvisioningUpdates \
            OTHER_CODE_SIGN_FLAGS="--keychain $RUNNER_TEMP/app-signing.keychain-db" \
            GCC_WARN_INHIBIT_ALL_WARNINGS=NO
          PLIST="$RUNNER_TEMP/Runner.xcarchive/Products/Applications/Runner.app/Frameworks/App.framework/Info.plist"
          if [ -f "$PLIST" ]; then
            /usr/libexec/PlistBuddy -c "Add :MinimumOSVersion string 13.0" "$PLIST" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Set :MinimumOSVersion 13.0" "$PLIST"
            echo "Patched MinimumOSVersion"
          fi
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/Runner.xcarchive \
            -exportPath $RUNNER_TEMP/ipa \
            -exportOptionsPlist ios/ExportOptions-adhoc.plist

      - name: Upload IPA as downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: fayow-adhoc-diagnostic
          path: ${{ runner.temp }}/ipa/*.ipa
          retention-days: 7